version: '3.8'

services:
  autoresearch:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
      - ./models:/app/models
      - ./.env:/app/.env:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  cache:
  data:
  models:
